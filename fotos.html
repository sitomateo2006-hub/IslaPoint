<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IslaPoint — Asignar Fotos</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
:root{
  --b9:#0a1628;--b8:#0d1f3c;--b7:#102a52;--b6:#1a3a6e;
  --b4:#2563eb;--b5:#1e4fa3;--b2:#93c5fd;--b0:#eff6ff;
  --ac:#06b6d4;
  --g1:#f1f5f9;--g2:#e2e8f0;--g4:#94a3b8;--g6:#475569;
  --green:#16a34a;--glight:#dcfce7;--gdark:#15803d;
  --red:#dc2626;--rs:8px;--hh:52px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--g1);overflow:hidden;-webkit-tap-highlight-color:transparent}

/* ── LOGIN ── */
#login-screen{
  display:flex;align-items:center;justify-content:center;
  position:fixed;inset:0;z-index:9999;padding:16px;
  background:linear-gradient(145deg,#0a1628,#0d2347);
}
.lbox{background:#fff;border-radius:20px;padding:36px 32px 28px;width:100%;max-width:380px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.llogo{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:18px}
.llogo img{height:50px;object-fit:contain}
.llogo-text{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;color:#0a1628}
.llogo-text span{color:#06b6d4}
.lsub-wrap{text-align:center;margin-bottom:18px}
.lsub{font-size:11px;color:var(--g4);text-transform:uppercase;letter-spacing:.8px;background:var(--g1);border-radius:20px;padding:4px 14px;border:1px solid var(--g2)}
.lf{margin-bottom:14px}
.lf label{display:block;font-size:11px;font-weight:700;color:var(--g6);margin-bottom:5px;text-transform:uppercase;letter-spacing:.8px}
.lf input{width:100%;padding:13px 14px;border:1.5px solid var(--g2);border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:16px;outline:none;transition:.2s;background:#f8fafc;color:#0f172a}
.lf input:focus{border-color:var(--b4);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.lbtn{width:100%;padding:13px;background:linear-gradient(135deg,var(--b4),var(--b5));color:#fff;border:none;border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:.2s;min-height:48px}
.lbtn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(37,99,235,.4)}
.lbtn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.lerr{display:none;margin-top:10px;padding:10px;background:#fef2f2;border:1px solid #fecaca;border-radius:var(--rs);color:var(--red);font-size:13px;text-align:center}

/* ── APP ── */
#app{display:none;flex-direction:column;height:100vh}
header{background:linear-gradient(135deg,var(--b9),var(--b8) 60%,var(--b7));height:var(--hh);padding:0 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.hlogo{display:flex;align-items:center;gap:10px}
.hlogo img{height:28px;object-fit:contain}
.hlogo-text{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;color:#fff}
.hlogo-text span{color:var(--ac)}
.htitle{font-size:11px;color:var(--b2);background:rgba(37,99,235,.2);border:1px solid rgba(37,99,235,.3);padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.hright{display:flex;align-items:center;gap:10px}
.hprog{font-size:12px;color:var(--b2);background:rgba(37,99,235,.2);padding:3px 12px;border-radius:20px;border:1px solid rgba(37,99,235,.3);white-space:nowrap}
.hout{padding:6px 12px;background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.3);border-radius:6px;color:#fca5a5;font-size:11px;font-weight:600;cursor:pointer}
.hout:hover{background:rgba(220,38,38,.25)}
.prog-bar{height:3px;background:var(--g2);flex-shrink:0}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--b4),var(--ac));transition:width .4s ease}

/* ── LAYOUT ── */
.main{display:grid;grid-template-columns:1fr 1fr;flex:1;min-height:0;overflow:hidden}

/* ── PANEL FOTOS ── */
.panel-fotos{background:#fff;border-right:1px solid var(--g2);display:flex;flex-direction:column;overflow:hidden}
.panel-header{padding:12px 14px;border-bottom:1px solid var(--g2);background:var(--g1);flex-shrink:0}
.panel-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--b9);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.foto-nav{display:flex;align-items:center;gap:8px}
.nav-btn{padding:8px 14px;background:var(--b4);color:#fff;border:none;border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;min-height:36px;white-space:nowrap}
.nav-btn:hover{background:var(--b5)}
.nav-btn:disabled{opacity:.35;cursor:not-allowed}
.foto-counter{font-size:13px;color:var(--g6);flex:1;text-align:center;font-weight:500}

/* Zona imagen */
/* Zona foto */
.foto-display{
  flex:1;min-height:0;
  position:relative;
  background:#1a1a2e;
  overflow:hidden;
  display:flex;flex-direction:column;
}
/* Imagen: ocupa todo el área de visualización */
.foto-img-wrap{
  flex:1;min-height:0;
  position:relative;
  overflow:hidden;
}
.foto-display img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center 60%;
  cursor:zoom-in;
  transition:object-position .25s ease;
}
/* Loader centrado */
.foto-cargando{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:#1a1a2e;font-size:13px;color:var(--g4);gap:8px;
  z-index:2;
}
/* Controles de posición — barra encima */
.foto-pos-bar{
  display:flex;align-items:center;gap:6px;
  padding:6px 10px;
  background:var(--g1);
  border-bottom:1px solid var(--g2);
  flex-shrink:0;
}
.foto-pos-label{font-size:10px;color:var(--g6);font-weight:600;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.pos-btn{
  padding:4px 10px;border:1.5px solid var(--g2);border-radius:6px;
  background:#fff;font-size:11px;font-weight:600;color:var(--g6);
  cursor:pointer;transition:.15s;white-space:nowrap;
}
.pos-btn:hover{border-color:var(--b4);color:var(--b4);background:var(--b0)}
.pos-btn.active{border-color:var(--b4);background:var(--b4);color:#fff}
.pos-sep{width:1px;height:16px;background:var(--g2);flex-shrink:0}
/* Modo fit completo */
.foto-display img.fit-full{object-fit:contain;object-position:center center}
/* Info superpuesta abajo */
.foto-info-bar{
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(transparent,rgba(10,22,40,.75));
  padding:24px 12px 8px;
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:8px;z-index:1;pointer-events:none;
}
.foto-nombre{font-size:10px;color:rgba(255,255,255,.7);font-family:monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foto-status{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap;flex-shrink:0;pointer-events:none}
.foto-status.asignada{color:#166534;background:rgba(220,252,231,.9)}
.foto-status.sin-asignar{color:rgba(255,255,255,.8);background:rgba(255,255,255,.15)}

/* Zona IDs */
.drive-zona{padding:10px 14px 12px;border-top:1px solid var(--g2);background:var(--g1);flex-shrink:0}
.drive-label{font-size:10px;font-weight:700;color:var(--g6);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.8px}
.drive-row{display:flex;gap:8px;margin-bottom:4px}
#drive-ids{flex:1;padding:8px 10px;border:1.5px solid var(--g2);border-radius:var(--rs);font-size:11px;outline:none;font-family:monospace;height:60px;resize:none;transition:.2s;color:var(--g6)}
#drive-ids:focus{border-color:var(--b4)}
.drive-btn{padding:8px 14px;background:var(--b4);color:#fff;border:none;border-radius:var(--rs);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;align-self:flex-end;min-height:34px;transition:.15s}
.drive-btn:hover{background:var(--b5)}
.drive-hint{font-size:10px;color:var(--g4)}

/* ── PANEL ESTABLECIMIENTOS ── */
.panel-est{display:flex;flex-direction:column;overflow:hidden;background:#fff}
.est-header{padding:10px 14px;border-bottom:1px solid var(--g2);background:var(--g1);flex-shrink:0}
.est-header-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--b9);margin-bottom:7px;display:flex;align-items:center;gap:6px}
.search-input{width:100%;padding:9px 12px;border:1.5px solid var(--g2);border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:.2s;background:#fff}
.search-input:focus{border-color:var(--b4);box-shadow:0 0 0 2px rgba(37,99,235,.1)}

.est-list{flex:1;overflow-y:auto;padding:6px;-webkit-overflow-scrolling:touch}
.est-list::-webkit-scrollbar{width:4px}
.est-list::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}

/* Separadores de sección */
.est-section-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--g4);padding:8px 10px 3px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.est-section-label::after{content:'';flex:1;height:1px;background:var(--g2)}
.est-section-label.completadas{color:var(--green)}
.est-section-label.sin-nombre{color:#b45309;background:#fffbeb;border-radius:6px;padding:6px 10px 4px;border:1px solid #fde68a}
.est-item.sin-nombre-item{border-left:3px solid #f59e0b;background:#fffbeb}
.est-item.sin-nombre-item .est-nombre{color:#b45309;font-style:italic}
.est-item.sin-nombre-item .est-thumb-empty{background:#fef3c7;border-color:#fde68a;color:#b45309}

.est-item{
  padding:9px 10px;border:1.5px solid var(--g2);border-radius:9px;
  margin-bottom:5px;cursor:pointer;transition:all .15s;
  display:flex;align-items:center;gap:9px;background:#fff;
  position:relative;
}
.est-item:hover{border-color:var(--b4);background:var(--b0);transform:translateX(2px)}
.est-item.tiene-foto{border-left:3px solid var(--green)}
.est-item.seleccionado{border-color:var(--b4);background:#dbeafe;box-shadow:0 0 0 2px rgba(37,99,235,.2)}
.est-item.seleccionado::before{content:'▶';position:absolute;left:-18px;color:var(--b4);font-size:10px}
.est-thumb{width:42px;height:42px;border-radius:7px;object-fit:cover;border:1px solid var(--g2);flex-shrink:0;background:var(--g1)}
.est-thumb-empty{width:42px;height:42px;border-radius:7px;background:var(--g1);border:1.5px dashed var(--g2);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--g4);font-size:17px}
.est-info{flex:1;min-width:0}
.est-nombre{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:var(--b9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.est-detalle{font-size:10px;color:var(--g4);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.est-codigo{font-size:10px;color:var(--b4);font-weight:700;background:var(--b0);padding:2px 6px;border-radius:10px;white-space:nowrap;flex-shrink:0}

/* Botón asignar — solo en hover o cuando está seleccionado */
.asignar-btn{
  padding:6px 10px;
  background:linear-gradient(135deg,var(--green),var(--gdark));
  color:#fff;border:none;border-radius:var(--rs);
  font-size:11px;font-weight:700;cursor:pointer;
  white-space:nowrap;transition:.15s;flex-shrink:0;min-height:30px;
  opacity:0;pointer-events:none;
}
.est-item:hover .asignar-btn,
.est-item.seleccionado .asignar-btn{opacity:1;pointer-events:auto}
.asignar-btn:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(22,163,74,.35)}

/* ── UTILIDADES ── */
.ldr{text-align:center;padding:28px 16px;color:var(--g4);font-size:13px}
.sp{display:inline-block;width:14px;height:14px;border:2px solid var(--g2);border-top-color:var(--b4);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);padding:10px 20px;border-radius:var(--rs);font-size:13px;font-weight:600;z-index:9999;display:block;opacity:0;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.15);transition:all .25s cubic-bezier(.32,.72,0,1);white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:var(--glight);color:#166534;border:1px solid #bbf7d0}
#toast.err{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
#toast.info{background:#dbeafe;color:#1e40af;border:1px solid #bfdbfe}

/* ── CONTROLES POSICIÓN FOTO ── */
let fotoFitMode=false;

function setPosV(pos){
  const img=document.getElementById('foto-img');
  if(!img) return;
  fotoFitMode=false;
  img.style.objectFit='cover';
  const posMap={top:'center 15%', center:'center 60%', bottom:'center 85%'};
  img.style.objectPosition=posMap[pos]||'center 60%';
  document.querySelectorAll('.pos-btn').forEach(b=>b.classList.remove('active'));
  const map={top:0,center:1,bottom:2};
  const btns=document.querySelectorAll('.pos-btn');
  if(map[pos]!==undefined) btns[map[pos]].classList.add('active');
  document.getElementById('pos-btn-fit').classList.remove('active');
}

function _activarBotonPos(posStr){
  // Encuentra el botón cuyo data-pos coincide o es el más cercano
  const val=parseInt(posStr)||60;
  const btns=[...document.querySelectorAll('.pos-btn[data-pos]')];
  if(!btns.length) return;
  btns.forEach(b=>b.classList.remove('active'));
  document.getElementById('pos-btn-fit')?.classList.remove('active');
  // El más cercano al valor
  const closest=btns.reduce((a,b)=>Math.abs(parseInt(b.dataset.pos)-val)<Math.abs(parseInt(a.dataset.pos)-val)?b:a);
  closest.classList.add('active');
  // Aplicar a la imagen
  const img=document.getElementById('foto-img');
  if(img){ img.style.objectFit='cover'; img.style.objectPosition=`center ${val}%`; }
}

function toggleFit(){
  const img=document.getElementById('foto-img');
  if(!img) return;
  fotoFitMode=!fotoFitMode;
  if(fotoFitMode){
    img.style.objectFit='contain';
    img.style.objectPosition='center center';
    document.querySelectorAll('.pos-btn').forEach(b=>b.classList.remove('active'));
    document.getElementById('pos-btn-fit').classList.add('active');
  } else {
    img.style.objectFit='cover';
    img.style.objectPosition='center 50%';
    document.querySelectorAll('.pos-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.pos-btn')[1].classList.add('active');
    document.getElementById('pos-btn-fit').classList.remove('active');
  }
}

/* ── MODAL FOTO AMPLIADA ── */
#modal-foto{display:none;position:fixed;inset:0;z-index:8000;background:rgba(0,0,0,.85);align-items:center;justify-content:center;cursor:zoom-out}
#modal-foto.open{display:flex}
#modal-foto img{max-width:92vw;max-height:90vh;object-fit:contain;border-radius:8px}

/* ── TAB BAR (móvil) ── */
.tab-bar{display:none}

/* ── RESPONSIVE ── */
@media(max-width:899px){
  .main{grid-template-columns:1fr;position:relative}
  .panel-fotos,.panel-est{position:absolute;inset:0;border-right:none;padding-bottom:58px}
  .panel-fotos.hidden,.panel-est.hidden{display:none}
  .tab-bar{
    display:flex;position:fixed;bottom:0;left:0;right:0;
    background:#fff;border-top:1px solid var(--g2);z-index:200;
    box-shadow:0 -2px 12px rgba(0,0,0,.1);
  }
  .tab-btn{
    flex:1;padding:9px 8px 11px;background:none;border:none;cursor:pointer;
    font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;color:var(--g4);
    display:flex;flex-direction:column;align-items:center;gap:2px;
    border-top:2px solid transparent;transition:.15s;
  }
  .tab-btn.active{color:var(--b4);border-top-color:var(--b4)}
  .tab-btn svg{width:20px;height:20px}
  .htitle{display:none}
  .asignar-btn{opacity:1!important;pointer-events:auto!important}
}
@media(max-width:479px){
  :root{--hh:48px}
  header{padding:0 12px}
  .hlogo img{height:24px}
  .hlogo-text{font-size:15px}
  .hprog{font-size:10px;padding:2px 8px}
  .lbox{padding:28px 20px 22px}
}
@media(min-width:1280px){
  .est-item{padding:10px 12px}
  .est-thumb,.est-thumb-empty{width:46px;height:46px}
  .est-nombre{font-size:13px}
}
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="lbox">
    <div class="llogo">
      <img src="https://raw.githubusercontent.com/sitomateo2006-hub/IslaPoint/main/logo.jpg" alt="IslaPoint"/>
      <span class="llogo-text">Isla<span>Point</span></span>
    </div>
    <div class="lsub-wrap"><span class="lsub">Gestor de Fotos</span></div>
    <div class="lf">
      <label>Contraseña de administrador</label>
      <input type="password" id="l-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>
    <button class="lbtn" id="l-btn" onclick="doLogin()">Entrar</button>
    <div class="lerr" id="l-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="hlogo">
      <img src="https://raw.githubusercontent.com/sitomateo2006-hub/IslaPoint/main/logo.jpg" alt="IslaPoint"/>
      <span class="hlogo-text">Isla<span>Point</span></span>
    </div>
    <span class="htitle">Gestor de Fotos</span>
    <div class="hright">
      <span class="hprog" id="h-prog">Cargando…</span>
      <button class="hout" onclick="doLogout()">Salir</button>
    </div>
  </header>
  <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>

  <div class="main">

    <!-- PANEL FOTOS -->
    <div class="panel-fotos" id="panel-fotos">
      <div class="panel-header">
        <div class="panel-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          Fotos de fachadas
        </div>
        <!-- Selector de carpeta -->
        <div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap">
          <button class="pos-btn active" id="btn-real" onclick="cambiarCarpeta('real')">📁 C. Real</button>
          <button class="pos-btn" id="btn-rosario" onclick="cambiarCarpeta('rosario')">📁 Rosario</button>
          <button class="pos-btn" id="btn-sanrafael" onclick="cambiarCarpeta('sanrafael')">📁 San Rafael</button>
        </div>
        <div class="foto-nav">
          <button class="nav-btn" id="btn-prev" onclick="navFoto(-1)" disabled>← Ant.</button>
          <span class="foto-counter" id="foto-counter">Sin fotos</span>
          <button class="nav-btn" id="btn-next" onclick="navFoto(1)" disabled>Sig. →</button>
        </div>
      </div>

      <div class="foto-display" id="foto-display">
        <!-- Barra de ajuste de posición -->
        <div class="foto-pos-bar">
          <span class="foto-pos-label">📐 Ver zona:</span>
          <button class="pos-btn" data-pos="15" onclick="setPosV('top')">⬆ Arriba</button>
          <button class="pos-btn active" data-pos="60" id="pos-btn-mid" onclick="setPosV('center')">▣ Centro</button>
          <button class="pos-btn" data-pos="85" onclick="setPosV('bottom')">⬇ Abajo</button>
          <div class="pos-sep"></div>
          <button class="pos-btn" id="pos-btn-fit" onclick="toggleFit()">⛶ Completa</button>
        </div>
        <!-- Imagen -->
        <div class="foto-img-wrap">
          <div class="foto-cargando" id="foto-placeholder">
            <div style="text-align:center">
              <div style="font-size:40px;margin-bottom:8px">📷</div>
              <div style="font-size:12px;color:var(--g4)">Las fotos se cargarán<br>al iniciar sesión</div>
            </div>
          </div>
          <img id="foto-img" src="" alt="" style="display:none" onclick="abrirModal(this.src)"/>
          <div class="foto-info-bar">
            <div class="foto-nombre" id="foto-nombre"></div>
            <div class="foto-status sin-asignar" id="foto-status"></div>
          </div>
        </div>
      </div>

/* ── HELPERS ── */
// Datos: siempre service_role (bypasea RLS)
function hdrs(){
  return{'apikey':KEY_SRV,'Authorization':'Bearer '+KEY_SRV,'Content-Type':'application/json','Prefer':'return=representation'};
}
// Auth: anon key para login
function hdrsAuth(){
  return{'apikey':KEY_SB,'Content-Type':'application/json'};
}

// URL de imagen que funciona con Drive (thumbnail público)
function driveUrl(id){
  return `https://drive.google.com/thumbnail?id=${id}&sz=w1200`;
}

let toastTimer=null;
function toast(msg,type='ok'){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className=type;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),3000);
}

/* ── TABS MÓVIL ── */
function switchTab(tab){
  const pf=document.getElementById('panel-fotos');
  const pe=document.getElementById('panel-est');
  document.getElementById('tab-fotos').classList.toggle('active',tab==='fotos');
  document.getElementById('tab-est').classList.toggle('active',tab==='est');
  pf.classList.toggle('hidden',tab!=='fotos');
  pe.classList.toggle('hidden',tab!=='est');
}

/* ── CONTROLES POSICIÓN FOTO ── */
let fotoFitMode=false;

function setPosV(pos){
  const img=document.getElementById('foto-img');
  if(!img) return;
  fotoFitMode=false;
  img.style.objectFit='cover';
  const posMap={top:'center 15%', center:'center 60%', bottom:'center 85%'};
  img.style.objectPosition=posMap[pos]||'center 60%';
  document.querySelectorAll('.pos-btn').forEach(b=>b.classList.remove('active'));
  const map={top:0,center:1,bottom:2};
  const btns=document.querySelectorAll('.pos-btn');
  if(map[pos]!==undefined) btns[map[pos]].classList.add('active');
  document.getElementById('pos-btn-fit').classList.remove('active');
}

function _activarBotonPos(posStr){
  // Encuentra el botón cuyo data-pos coincide o es el más cercano
  const val=parseInt(posStr)||60;
  const btns=[...document.querySelectorAll('.pos-btn[data-pos]')];
  if(!btns.length) return;
  btns.forEach(b=>b.classList.remove('active'));
  document.getElementById('pos-btn-fit')?.classList.remove('active');
  // El más cercano al valor
  const closest=btns.reduce((a,b)=>Math.abs(parseInt(b.dataset.pos)-val)<Math.abs(parseInt(a.dataset.pos)-val)?b:a);
  closest.classList.add('active');
  // Aplicar a la imagen
  const img=document.getElementById('foto-img');
  if(img){ img.style.objectFit='cover'; img.style.objectPosition=`center ${val}%`; }
}

function toggleFit(){
  const img=document.getElementById('foto-img');
  if(!img) return;
  fotoFitMode=!fotoFitMode;
  if(fotoFitMode){
    img.style.objectFit='contain';
    img.style.objectPosition='center center';
    document.querySelectorAll('.pos-btn').forEach(b=>b.classList.remove('active'));
    document.getElementById('pos-btn-fit').classList.add('active');
  } else {
    img.style.objectFit='cover';
    img.style.objectPosition='center 50%';
    document.querySelectorAll('.pos-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.pos-btn')[1].classList.add('active');
    document.getElementById('pos-btn-fit').classList.remove('active');
  }
}

/* ── MODAL FOTO AMPLIADA ── */
function abrirModal(src){
  document.getElementById('modal-img').src=src;
  document.getElementById('modal-foto').classList.add('open');
}
function cerrarModal(){
  document.getElementById('modal-foto').classList.remove('open');
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') cerrarModal();
  if(document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='TEXTAREA') return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown') navFoto(1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') navFoto(-1);
});

/* ── LOGIN / LOGOUT ── */
async function doLogin(){
  const pass=document.getElementById('l-pass').value.trim();
  const btn=document.getElementById('l-btn');
  const err=document.getElementById('l-err');
  if(!pass){err.textContent='Introduce la contraseña';err.style.display='block';return;}
  btn.disabled=true;btn.textContent='Entrando…';err.style.display='none';
  try{
    const res=await fetch(`${URL_SB}/auth/v1/token?grant_type=password`,{
      method:'POST',
      headers:hdrsAuth(),
      body:JSON.stringify({email:ADMIN_EMAIL,password:pass})
    });
    const data=await res.json();
    if(!res.ok) throw new Error('Contraseña incorrecta');
    SESSION=data;
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='flex';
    iniciar();
  }catch(e){err.textContent=e.message;err.style.display='block';}
  finally{btn.disabled=false;btn.textContent='Entrar';}
}

function doLogout(){
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('l-pass').value='';
  SESSION=null;allEst=[];filtrados=[];fotos=[];fotoIdx=0;codigoActual=null;
}

/* ── INICIO (después de login) ── */
function iniciar(){
  cargarCarpeta('real');
  loadEst();
}

function cambiarCarpeta(nombre){
  carpetaActiva=nombre;
  // Actualizar botones activos
  ['real','rosario','sanrafael'].forEach(c=>{
    const btn=document.getElementById('btn-'+c);
    if(btn) btn.classList.toggle('active',c===nombre);
  });
  cargarCarpeta(nombre);
}

function cargarCarpeta(nombre){
  const c=CARPETAS[nombre];
  if(!c) return;
  document.getElementById('drive-ids').value=c.ids.join('\n');
  fotos=c.ids.map((id,i)=>({num:i+1,id,url:driveUrl(id)}));
  fotoIdx=0;
  mostrarFoto();
  toast(`${c.label} cargada`,'info');
}

/* ── RECARGAR FOTOS desde textarea (por si se añaden IDs 267-351) ── */
function cargarFotos(){
  const raw=document.getElementById('drive-ids').value.trim();
  if(!raw){toast('No hay IDs en el textarea','err');return;}
  const ids=raw.split(/[\n,;\s]+/).map(s=>s.trim()).filter(s=>s.length>15);
  if(!ids.length){toast('No se encontraron IDs válidos (mínimo 16 caracteres)','err');return;}
  // Actualizar carpeta activa con los nuevos IDs
  if(CARPETAS[carpetaActiva]) CARPETAS[carpetaActiva].ids=ids;
  fotos=ids.map((id,i)=>({num:i+1,id,url:driveUrl(id)}));
  fotoIdx=0;
  mostrarFoto();
  toast(`✅ ${fotos.length} fotos recargadas`);
}

/* ── MOSTRAR FOTO ACTUAL ── */
function mostrarFoto(){
  if(!fotos.length) return;
  const foto=fotos[fotoIdx];
  const img=document.getElementById('foto-img');
  const placeholder=document.getElementById('foto-placeholder');
  const status=document.getElementById('foto-status');

  // Mostrar loader mientras carga
  img.style.display='none';
  placeholder.style.display='flex';
  placeholder.innerHTML='<div class="sp"></div><span>Cargando foto…</span>';

  img.onload=()=>{
    placeholder.style.display='none';
    img.style.display='block';
  };
  img.onerror=()=>{
    placeholder.innerHTML='<div style="text-align:center"><div style="font-size:32px">⚠️</div><div style="font-size:11px;margin-top:4px;color:var(--g4)">No se pudo cargar la imagen<br>Puede que Drive requiera permiso público</div></div>';
    img.style.display='none';
  };
  img.src=foto.url;

  document.getElementById('foto-nombre').textContent=`Foto ${foto.num} / ${fotos.length} — ID: ${foto.id.slice(0,12)}…`;
  document.getElementById('foto-counter').textContent=`${fotoIdx+1} / ${fotos.length}`;
  document.getElementById('btn-prev').disabled=fotoIdx===0;
  document.getElementById('btn-next').disabled=fotoIdx===fotos.length-1;

  // Estado asignación
  const asignada=allEst.find(e=>e['Foto-URL']&&e['Foto-URL'].includes(foto.id));
  if(asignada){
    // Leer pos guardada en la URL
    const urlParams=new URLSearchParams(asignada['Foto-URL']?.split('?')[1]||'');
    const posGuardada=urlParams.get('pos')||'60';
    status.textContent=`✅ Asignada a: ${asignada.Nombre} (#${asignada.Codigo}) · pos ${posGuardada}%`;
    status.className='foto-status asignada';
    // Restaurar botón activo según pos guardada
    _activarBotonPos(posGuardada);
  }else{
    status.textContent='Sin asignar — ajusta posición y haz clic →';
    status.className='foto-status sin-asignar';
  }
}

function navFoto(dir){
  fotoIdx=Math.max(0,Math.min(fotos.length-1,fotoIdx+dir));
  mostrarFoto();
}

/* ── CARGAR ESTABLECIMIENTOS ── */
async function loadEst(){
  document.getElementById('est-list').innerHTML='<div class="ldr"><span class="sp"></span>Cargando establecimientos…</div>';
  try{
    let all=[],from=0;
    while(true){
      const url=`${URL_SB}/rest/v1/${TABLE}?select=*&order=Codigo.asc&offset=${from}&limit=1000`;
      const res=await fetch(url,{headers:hdrs()});
      const txt=await res.text();
      if(!res.ok) throw new Error(`HTTP ${res.status}: ${txt.slice(0,200)}`);
      let batch;
      try{ batch=JSON.parse(txt); }
      catch(pe){ throw new Error('Respuesta no es JSON: '+txt.slice(0,100)); }
      if(!Array.isArray(batch)){
        if(batch&&batch.message) throw new Error(batch.message);
        throw new Error('Respuesta inesperada');
      }
      if(!batch.length) break;
      all=all.concat(batch);
      if(batch.length<1000) break;
      from+=1000;
    }
    if(!all.length){
      document.getElementById('est-list').innerHTML='<div class="ldr" style="color:var(--red)">⚠️ Tabla vacía o sin acceso</div>';
      return;
    }
    allEst=all;
    filtrados=[...allEst];
    const primerPendiente=allEst.filter(e=>!e['Foto-URL']).sort((a,b)=>a.Codigo-b.Codigo)[0];
    codigoActual=primerPendiente?.Codigo||null;
    renderEst();
    actualizarProgreso();
    toast(`📋 ${allEst.length} establecimientos cargados`,'info');
  }catch(e){
    console.error('loadEst:',e);
    document.getElementById('est-list').innerHTML=`<div class="ldr" style="color:var(--red)">❌ ${e.message}</div>`;
    toast('Error cargando establecimientos','err');
  }
}

function actualizarProgreso(){
  const con=allEst.filter(e=>e['Foto-URL']).length;
  const total=allEst.length;
  const pct=total?Math.round(con/total*100):0;
  document.getElementById('h-prog').textContent=`${con}/${total} · ${pct}%`;
  document.getElementById('prog-fill').style.width=pct+'%';
}

/* ── RENDER LISTA ── */
function renderEst(){
  const list=document.getElementById('est-list');
  if(!filtrados.length){list.innerHTML='<div class="ldr">Sin resultados</div>';return;}

  const q=document.getElementById('est-search').value.trim();
  let html='';

  if(q){
    // Con búsqueda: lista plana ordenada por Codigo
    const sorted=[...filtrados].sort((a,b)=>a.Codigo-b.Codigo);
    html=sorted.map(it=>itemHTML(it)).join('');
  }else{
    // Cuatro grupos: sin nombre primero (urgente), pendientes, con foto, y dentro sin nombre+foto
    const sinNombre=[...filtrados].filter(e=>!e.Nombre||!e.Nombre.trim()).sort((a,b)=>a.Codigo-b.Codigo);
    const sinFotoConNombre=[...filtrados].filter(e=>e.Nombre&&e.Nombre.trim()&&!e['Foto-URL']).sort((a,b)=>a.Codigo-b.Codigo);
    const conFoto=[...filtrados].filter(e=>e['Foto-URL']&&e.Nombre&&e.Nombre.trim()).sort((a,b)=>a.Codigo-b.Codigo);

    if(sinNombre.length){
      html+=`<div class="est-section-label sin-nombre">❓ Sin nombre — ${sinNombre.length}</div>`;
      html+=sinNombre.map(it=>itemHTML(it)).join('');
    }
    if(sinFotoConNombre.length){
      html+=`<div class="est-section-label">📷 Pendientes — ${sinFotoConNombre.length}</div>`;
      html+=sinFotoConNombre.map(it=>itemHTML(it)).join('');
    }
    if(conFoto.length){
      html+=`<div class="est-section-label completadas">✅ Con foto — ${conFoto.length}</div>`;
      html+=conFoto.map(it=>itemHTML(it)).join('');
    }
  }
  list.innerHTML=html;

  // Scroll al activo
  if(codigoActual){
    const el=list.querySelector(`.est-item[data-id="${codigoActual}"]`);
    if(el) setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'center'}),100);
  }
}

function itemHTML(it){
  const dir=[it.Calle,it['Número']].filter(Boolean).join(' nº ');
  const conFoto=!!it['Foto-URL'];
  const activo=String(it.Codigo)===String(codigoActual);
  const thumb=conFoto
    ?`<img class="est-thumb" src="${it['Foto-URL']}" alt="" loading="lazy" onerror="this.style.display='none'">`
    :`<div class="est-thumb-empty">🏪</div>`;
  const sinNombreItem=!it.Nombre||!it.Nombre.trim();
  return `<div class="est-item${conFoto?' tiene-foto':''}${activo?' seleccionado':''}${sinNombreItem?' sin-nombre-item':''}"
    data-id="${it.Codigo}"
    onclick="seleccionarEst(${it.Codigo})">
    ${thumb}
    <div class="est-info">
      <div class="est-nombre">${it.Nombre||'Sin nombre'}</div>
      <div class="est-detalle">${dir||'Sin dirección'}${it.Actividad?' · '+it.Actividad:''}</div>
    </div>
    <span class="est-codigo">#${it.Codigo}</span>
    <button class="asignar-btn" onclick="event.stopPropagation();asignarFoto(${it.Codigo})">
      ${conFoto?'🔄 Cambiar':'📷 Asignar'}
    </button>
  </div>`;
}

/* ── SELECCIONAR (solo resaltar, sin asignar) ── */
function seleccionarEst(codigo){
  codigoActual=codigo;
  renderEst();
  // En móvil, ir al panel de fotos para confirmar visualmente
  if(window.innerWidth<900) switchTab('fotos');
}

/* ── FILTRAR ── */
function filtrarEst(){
  const q=document.getElementById('est-search').value.toLowerCase().trim();
  filtrados=!q?[...allEst]:allEst.filter(e=>
    (e.Nombre||'').toLowerCase().includes(q)||
    (e.Calle||'').toLowerCase().includes(q)||
    String(e.Codigo).includes(q)||
    (e.Actividad||'').toLowerCase().includes(q)
  );
  renderEst();
}

/* ── ASIGNAR FOTO → SUPABASE ── */
async function asignarFoto(codigo){
  if(!fotos.length){toast('Primero carga las fotos','err');return;}
  const foto=fotos[fotoIdx];
  const est=allEst.find(e=>String(e.Codigo)===String(codigo));

  try{
    // Leer posición actual del slider (0-100), default 60
    const posVal=document.querySelector('.pos-btn.active[data-pos]')?.dataset.pos||'60';
    const urlConPos=foto.url+'&pos='+posVal;

    const res=await fetch(`${URL_SB}/rest/v1/${TABLE}?Codigo=eq.${codigo}`,{
      method:'PATCH',
      headers:hdrs(),
      body:JSON.stringify({'Foto-URL':urlConPos})
    });
    if(!res.ok){
      const txt=await res.text();
      throw new Error(txt||`HTTP ${res.status}`);
    }

    // Actualizar local
    if(est) est['Foto-URL']=foto.url;
    toast(`✅ Foto ${foto.num} → ${est?.Nombre||'#'+codigo}`);

    // Siguiente pendiente automáticamente
    const siguientes=allEst.filter(e=>!e['Foto-URL']).sort((a,b)=>a.Codigo-b.Codigo);
    codigoActual=siguientes[0]?.Codigo||null;

    renderEst();
    actualizarProgreso();

    // Avanzar a la siguiente foto de Drive
    setTimeout(()=>{
      navFoto(1);
      // En móvil, volver a fotos para ver la siguiente
      if(window.innerWidth<900) switchTab('fotos');
    },400);

  }catch(e){
    console.error('Error asignando foto:',e);
    toast(`Error: ${e.message}`,'err');
  }
}
</script>
